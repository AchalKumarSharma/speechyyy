[package]
name = "speechyyy"
version = "0.1.3"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
evdev = "0.13.2"
libc = "0.2.191"
ringbuf = "0.6.0"
rpassword = "7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
toml = "1.1.8"
ureq = { version = "2", features = ["tls", "json"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
indicatif = "0.17"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.2.0 or v0.2.0-rc1)'
        required: true
        type: string
        default: 'v0.2.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sanity:
    name: Tag & Version Sanity Check
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Tag & Manifest
        id: validate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "Validating release tag: $TAG"
          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$TAG" =~ $TAG_REGEX ]]; then
            echo "::error::Tag '$TAG' does not match semver format ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$"
            exit 1
          fi

          BASE_VER=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CARGO_VER=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          if [ "$BASE_VER" != "$CARGO_VER" ]; then
            echo "::error::Tag base version '$BASE_VER' does not match Cargo.toml version '$CARGO_VER'"
            exit 1
          fi
          echo "[✓] Tag '$TAG' successfully verified against Cargo.toml ($CARGO_VER)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test & Lint
    needs: [sanity]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libasound2-dev \
            libbz2-dev \
            cmake \
            wl-clipboard

      - name: Run test suite
        run: cargo test --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run cargo-audit
        run: |
          cargo install --locked cargo-audit
          cargo audit

  build:
    name: Build (${{ matrix.arch }})
    needs: [sanity]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libasound2-dev \
            libbz2-dev \
            cmake

      - name: Compile release binaries
        run: cargo build --release --locked --bin speechyyy --bin speechyyy-dock

      - name: Run smoke tests and inspection
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ./target/release/speechyyy --version
          ./target/release/speechyyy --help
          ./target/release/speechyyy-dock --version
          ./target/release/speechyyy-dock --help
          echo "=== speechyyy dynamic linking ==="
          ldd ./target/release/speechyyy
          echo "=== speechyyy-dock dynamic linking ==="
          ldd ./target/release/speechyyy-dock

          echo "### Glibc Symbol Versions ($ARCH)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          objdump -T ./target/release/speechyyy | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 5 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package deterministic release archive
        env:
          TAG: ${{ needs.sanity.outputs.tag || inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          STAGE_DIR="speechyyy-${TAG}-${ARCH}-linux"
          mkdir -p "$STAGE_DIR"

          cp target/release/speechyyy "$STAGE_DIR/"
          cp target/release/speechyyy-dock "$STAGE_DIR/"
          find target/release/ -maxdepth 1 -name "*.so*" -exec cp -d {} "$STAGE_DIR/" \; 2>/dev/null || true

          [ -f "LICENSE" ] && cp LICENSE "$STAGE_DIR/"
          [ -f "THIRD_PARTY_MODELS.md" ] && cp THIRD_PARTY_MODELS.md "$STAGE_DIR/"
          [ -f "README.md" ] && cp README.md "$STAGE_DIR/"

          ARCHIVE_NAME="${STAGE_DIR}.tar.gz"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${SOURCE_DATE_EPOCH}" -czf "$ARCHIVE_NAME" "$STAGE_DIR"

          echo "Created archive: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME"

      - name: Upload release archive
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: release-archive-${{ matrix.arch }}
          path: speechyyy-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Draft Release
    needs: [sanity, test, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all release archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-archive-*
          merge-multiple: true

      - name: Generate single SHA256SUMS and verify
        run: |
          echo "Generating SHA256SUMS for release archives..."
          sha256sum speechyyy-*.tar.gz > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          echo "=== Verifying SHA256SUMS ==="
          sha256sum -c SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.sanity.outputs.tag || inputs.tag || github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "Publishing draft release for tag: $TAG (flags: $PRERELEASE_FLAG)"
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            $PRERELEASE_FLAG \
            speechyyy-*.tar.gz SHA256SUMS

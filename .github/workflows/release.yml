name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        run: |
          ARCHIVE_NAME="speechyyy-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p package_staging
          cp target/release/speechyyy package_staging/
          find target/release/ -maxdepth 1 -name "*.so*" -exec cp -d {} package_staging/ \; 2>/dev/null || true
          mkdir -p package_staging/extra
          cp extra/99-speechyyy-uinput.rules package_staging/extra/
          [ -f "README.md" ] && cp README.md package_staging/
          [ -f "LICENSE" ] && cp LICENSE package_staging/
          tar -czvf "$ARCHIVE_NAME" -C package_staging .
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            speechyyy-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            speechyyy-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256

